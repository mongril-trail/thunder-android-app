<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thunder - Watch Movies & TV Shows</title>
  <style>
    /* CSS Reset & Global Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.5rem;
      background-color: rgba(9, 9, 11, 0.95);
      border-bottom: 1px solid #18181b;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .logo {
      color: #e50914;
      font-size: 1.6rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .search-form {
      display: flex;
      gap: 0.4rem;
    }
    .search-input {
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      border: 1px solid #27272a;
      background-color: #18181b;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      width: 180px;
    }
    .search-btn {
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      border: none;
      background-color: #27272a;
      color: #fff;
      cursor: pointer;
    }

    /* Hero Banner */
    .hero-banner {
      position: relative;
      height: 60vh;
      min-height: 380px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 2rem;
      transition: background-image 0.4s ease-in-out;
    }
    .hero-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      font-size: 2rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-arrow.left { left: 1rem; }
    .hero-arrow.right { right: 1rem; }
    .hero-content {
      max-width: 650px;
      z-index: 10;
    }
    .hero-tags {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
    .rating-red {
      color: #e50914;
      font-weight: bold;
    }
    .hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.6rem;
      line-height: 1.1;
    }
    .hero-overview {
      font-size: 0.88rem;
      color: #d4d4d8;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.2rem;
    }
    .btn-play {
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      border: none;
      background-color: #e50914;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-more {
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      border: none;
      background-color: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    /* Content Body & Carousels */
    .content-body {
      padding: 1.5rem;
      padding-bottom: 70px;
    }
    .section-container {
      margin-bottom: 2rem;
      position: relative;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      border-left: 4px solid #e50914;
      padding-left: 0.6rem;
    }
    .filter-tabs {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
    }
    .filter-tab {
      cursor: pointer;
      padding-bottom: 2px;
      color: #a1a1aa;
    }
    .filter-tab.active {
      color: #e50914;
      border-bottom: 2px solid #e50914;
    }

    /* Carousel Elements (Hides scrollbar site-wide) */
    .carousel-wrapper {
      position: relative;
    }
    .carousel-container {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    .carousel-container::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }
    .carousel-arrow {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 1px solid #27272a;
      font-size: 1.8rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carousel-arrow.left { left: -12px; }
    .carousel-arrow.right { right: -12px; }

    /* Type 2 Poster Card */
    .card {
      min-width: 160px;
      max-width: 160px;
      background-color: #18181b;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #27272a;
      flex-shrink: 0;
    }
    .poster-wrapper {
      aspect-ratio: 2/3;
      background-color: #27272a;
      position: relative;
    }
    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background-color: #e50914;
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: bold;
    }
    .rank-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background-color: #e50914;
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }
    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-meta {
      padding: 0.5rem;
    }
    .card-title {
      margin: 0;
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      font-size: 0.68rem;
      color: #a1a1aa;
      margin-top: 0.2rem;
      display: flex;
      gap: 0.3rem;
    }

    /* Detail / Watch View */
    .detail-view {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
      padding-bottom: 70px;
    }
    .back-btn {
      margin-bottom: 1rem;
      background-color: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #27272a;
    }
    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .selector-card {
      margin-top: 1.2rem;
      background-color: #18181b;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #27272a;
    }
    .selector-title {
      margin-bottom: 0.8rem;
      color: #e50914;
      font-size: 0.95rem;
    }
    .flex-row {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .season-btn {
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      border: none;
      background-color: #27272a;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.8rem;
    }
    .season-btn.active {
      background-color: #e50914;
    }
    .episode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
      gap: 0.4rem;
      margin-top: 0.8rem;
    }
    .episode-btn {
      padding: 0.45rem;
      border-radius: 4px;
      border: none;
      background-color: #27272a;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .episode-btn.active {
      background-color: #ffffff;
      color: #000000;
    }
    .meta-block {
      margin-top: 1.2rem;
    }
    .detail-title {
      font-size: 1.8rem;
      font-weight: 800;
    }
    .meta-sub {
      font-size: 0.85rem;
      color: #a1a1aa;
      display: flex;
      gap: 0.8rem;
      margin-top: 0.4rem;
      align-items: center;
    }
    .type-badge {
      background-color: #27272a;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .overview-text {
      line-height: 1.5;
      color: #d4d4d8;
      margin-top: 0.8rem;
      font-size: 0.9rem;
    }

    /* Search Results Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    /* Mobile Navigation Bar */
    .mobile-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background-color: #09090b;
      border-top: 1px solid #18181b;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 200;
    }
    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #a1a1aa;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo" id="appLogo">CINEBY</div>
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" class="search-input" placeholder="Search..." />
      <button type="submit" class="search-btn">🔍</button>
    </form>
  </header>

  <!-- HOME PAGE VIEW -->
  <div id="homePage">
    <!-- Hero Banner -->
    <div id="heroBanner" class="hero-banner">
      <button class="hero-arrow left" id="heroPrevBtn">‹</button>
      <button class="hero-arrow right" id="heroNextBtn">›</button>
      <div class="hero-content" id="heroContent"></div>
    </div>

    <div class="content-body">
      <!-- Search Results Container (Hidden by default) -->
      <div id="searchResultsSection" style="display: none;">
        <h2 class="section-title" id="searchTitle">Search Results</h2>
        <div class="grid-container" id="searchResultsGrid"></div>
      </div>

      <!-- Main Catalog Sections -->
      <div id="mainCatalog">
        <!-- Continue Watching Section -->
        <div class="section-container" id="continueWatchingSection" style="display: none;">
          <h3 class="section-title">Continue Watching</h3>
          <div class="carousel-wrapper">
            <button class="carousel-arrow left" onclick="scrollCarousel('continueCarousel', -400)">‹</button>
            <div class="carousel-container" id="continueCarousel"></div>
            <button class="carousel-arrow right" onclick="scrollCarousel('continueCarousel', 400)">›</button>
          </div>
        </div>

        <!-- Top 10 Today Section -->
        <div class="section-container">
          <h3 class="section-title">TOP 10 Today</h3>
          <div class="carousel-wrapper">
            <button class="carousel-arrow left" onclick="scrollCarousel('top10Carousel', -400)">‹</button>
            <div class="carousel-container" id="top10Carousel"></div>
            <button class="carousel-arrow right" onclick="scrollCarousel('top10Carousel', 400)">›</button>
          </div>
        </div>

        <!-- Trending Today Section -->
        <div class="section-container">
          <div class="section-header">
            <h3 class="section-title">Trending Today</h3>
            <div class="filter-tabs">
              <span class="filter-tab active" id="tabTrendMovie" onclick="setTrendingFilter('movie')">Movies</span>
              <span class="filter-tab" id="tabTrendTv" onclick="setTrendingFilter('tv')">Series</span>
            </div>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-arrow left" onclick="scrollCarousel('trendingCarousel', -400)">‹</button>
            <div class="carousel-container" id="trendingCarousel"></div>
            <button class="carousel-arrow right" onclick="scrollCarousel('trendingCarousel', 400)">›</button>
          </div>
        </div>

        <!-- Top Rated Section -->
        <div class="section-container">
          <div class="section-header">
            <h3 class="section-title">Top Rated</h3>
            <div class="filter-tabs">
              <span class="filter-tab active" id="tabTopMovie" onclick="setTopRatedFilter('movie')">Movies</span>
              <span class="filter-tab" id="tabTopTv" onclick="setTopRatedFilter('tv')">Series</span>
            </div>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-arrow left" onclick="scrollCarousel('topRatedCarousel', -400)">‹</button>
            <div class="carousel-container" id="topRatedCarousel"></div>
            <button class="carousel-arrow right" onclick="scrollCarousel('topRatedCarousel', 400)">›</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- DETAIL / WATCH PAGE VIEW -->
  <div id="detailPage" class="detail-view" style="display: none;">
    <button class="back-btn" id="backHomeBtn">← Back to Home</button>

    <div class="player-wrapper">
      <iframe id="videoPlayer" title="Player" allowfullscreen></iframe>
    </div>

    <!-- Season / Episode Selector (TV Series Only) -->
    <div class="selector-card" id="tvSelectorCard" style="display: none;">
      <h4 class="selector-title">Seasons & Episodes</h4>
      <div class="flex-row" id="seasonsRow"></div>
      <div class="episode-grid" id="episodesGrid"></div>
    </div>

    <div class="meta-block" id="metaBlock"></div>

    <!-- You May Like Row -->
    <div class="section-container" style="margin-top: 2rem;">
      <h3 class="section-title">You May Like</h3>
      <div class="carousel-wrapper">
        <button class="carousel-arrow left" onclick="scrollCarousel('similarCarousel', -400)">‹</button>
        <div class="carousel-container" id="similarCarousel"></div>
        <button class="carousel-arrow right" onclick="scrollCarousel('similarCarousel', 400)">›</button>
      </div>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAVBAR -->
  <div class="mobile-bottom-bar">
    <div class="mobile-nav-item" id="mobileHomeBtn">
      <span style="font-size: 1.2rem;">🏠</span>
      <span style="font-size: 0.65rem;">Home</span>
    </div>
    <div class="mobile-nav-item" id="mobileSearchBtn">
      <span style="font-size: 1.2rem;">🔍</span>
      <span style="font-size: 0.65rem;">Search</span>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const TMDB_API_KEY = '8baba8ab6b8bbe247645bcae7df63d0d';
    const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
    const BACKDROP_BASE_URL = 'https://image.tmdb.org/t/p/original';

    // Application State
    let heroItems = [];
    let heroIndex = 0;
    let selectedMedia = null;
    let selectedSeason = 1;
    let selectedEpisode = 1;

    // Filter States
    let trendingFilter = 'movie';
    let topRatedFilter = 'movie';

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      fetchCatalogs();
      fetchTrending('movie');
      fetchTopRated('movie');
      loadContinueWatching();

      // Navigation Listeners
      document.getElementById('appLogo').addEventListener('click', showHome);
      document.getElementById('mobileHomeBtn').addEventListener('click', showHome);
      document.getElementById('backHomeBtn').addEventListener('click', showHome);
      
      document.getElementById('mobileSearchBtn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.getElementById('searchInput').focus();
      });

      // Search Handler
      document.getElementById('searchForm').addEventListener('submit', handleSearch);

      // Hero Nav Controls
      document.getElementById('heroPrevBtn').addEventListener('click', () => {
        heroIndex = (heroIndex - 1 + heroItems.length) % heroItems.length;
        renderHero();
      });
      document.getElementById('heroNextBtn').addEventListener('click', () => {
        heroIndex = (heroIndex + 1) % heroItems.length;
        renderHero();
      });
    });

    // Navigation Switches
    function showHome() {
      document.getElementById('homePage').style.display = 'block';
      document.getElementById('detailPage').style.display = 'none';
      document.getElementById('searchResultsSection').style.display = 'none';
      document.getElementById('mainCatalog').style.display = 'block';
      document.getElementById('videoPlayer').src = ''; // Stop player
      loadContinueWatching();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function scrollCarousel(id, offset) {
      const container = document.getElementById(id);
      if (container) {
        container.scrollBy({ left: offset, behavior: 'smooth' });
      }
    }

    // Fetch Initial Top 10 and Hero
    async function fetchCatalogs() {
      try {
        const res = await fetch(`${TMDB_BASE_URL}/trending/all/day?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        if (data.results) {
          const items = data.results.slice(0, 10);
          heroItems = items.slice(0, 5);
          renderHero();
          renderCarousel('top10Carousel', items, { showRank: true });
        }
      } catch (err) {
        console.error('Catalog fetch error:', err);
      }
    }

    // Render Hero Banner
    function renderHero() {
      if (!heroItems.length) return;
      const item = heroItems[heroIndex];
      const banner = document.getElementById('heroBanner');
      const content = document.getElementById('heroContent');

      banner.style.backgroundImage = `linear-gradient(to top, #09090b 10%, rgba(9, 9, 11, 0.4) 50%, rgba(9, 9, 11, 0.8) 100%), url(${BACKDROP_BASE_URL}${item.backdrop_path})`;

      const date = (item.release_date || item.first_air_date)?.split('-')[0] || '';
      const type = (item.media_type || (item.first_air_date ? 'TV' : 'Movie')).toUpperCase();

      content.innerHTML = `
        <div class="hero-tags">
          <span class="rating-red">★ ${item.vote_average?.toFixed(1) || 'N/A'}</span>
          <span>•</span>
          <span>${date}</span>
          <span>•</span>
          <span>${type}</span>
        </div>
        <h2 class="hero-title">${item.title || item.name}</h2>
        <p class="hero-overview">${item.overview || ''}</p>
        <div class="hero-actions">
          <button class="btn-play" onclick='openDetail(${JSON.stringify(item).replace(/'/g, "&apos;")}, true)'>▶ Play</button>
          <button class="btn-more" onclick='openDetail(${JSON.stringify(item).replace(/'/g, "&apos;")}, false)'>ⓘ See More</button>
        </div>
      `;
    }

    // Fetch Trending
    async function fetchTrending(type) {
      trendingFilter = type;
      try {
        const endpoint = type === 'tv' ? '/trending/tv/week' : '/trending/movie/week';
        const res = await fetch(`${TMDB_BASE_URL}${endpoint}?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        if (data.results) {
          renderCarousel('trendingCarousel', data.results.map(i => ({ ...i, media_type: type })));
        }
      } catch (err) {
        console.error('Trending fetch error:', err);
      }
    }

    function setTrendingFilter(type) {
      document.getElementById('tabTrendMovie').className = `filter-tab ${type === 'movie' ? 'active' : ''}`;
      document.getElementById('tabTrendTv').className = `filter-tab ${type === 'tv' ? 'active' : ''}`;
      fetchTrending(type);
    }

    // Fetch Top Rated
    async function fetchTopRated(type) {
      topRatedFilter = type;
      try {
        const endpoint = type === 'tv' ? '/tv/top_rated' : '/movie/top_rated';
        const res = await fetch(`${TMDB_BASE_URL}${endpoint}?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        if (data.results) {
          renderCarousel('topRatedCarousel', data.results.map(i => ({ ...i, media_type: type })));
        }
      } catch (err) {
        console.error('Top Rated fetch error:', err);
      }
    }

    function setTopRatedFilter(type) {
      document.getElementById('tabTopMovie').className = `filter-tab ${type === 'movie' ? 'active' : ''}`;
      document.getElementById('tabTopTv').className = `filter-tab ${type === 'tv' ? 'active' : ''}`;
      fetchTopRated(type);
    }

    // Search Execution
    async function handleSearch(e) {
      e.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      try {
        const res = await fetch(`${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data.results) {
          const filtered = data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv');
          document.getElementById('mainCatalog').style.display = 'none';
          document.getElementById('searchResultsSection').style.display = 'block';
          document.getElementById('searchTitle').innerText = `Search Results (${filtered.length})`;

          const grid = document.getElementById('searchResultsGrid');
          grid.innerHTML = '';
          filtered.forEach(item => grid.appendChild(createPosterCard(item)));
        }
      } catch (err) {
        console.error('Search error:', err);
      }
    }

    // Render Carousels
    function renderCarousel(containerId, items, options = {}) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      items.forEach((item, index) => {
        const cardOptions = { ...options };
        if (options.showRank) cardOptions.rank = index + 1;
        container.appendChild(createPosterCard(item, cardOptions));
      });
    }

    // Card Builder (Type 2 Poster)
    function createPosterCard(item, options = {}) {
      const card = document.createElement('div');
      card.className = 'card';

      const title = item.title || item.name;
      const date = (item.release_date || item.first_air_date)?.split('-')[0] || '';
      const type = item.media_type === 'tv' || item.first_air_date ? 'TV' : 'Movie';

      const posterMarkup = item.poster_path 
        ? `<img src="${IMAGE_BASE_URL}${item.poster_path}" alt="${title}" class="poster-img"/>`
        : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:0.75rem;color:#71717a">No Poster</div>`;

      const deleteBtnMarkup = options.isContinue 
        ? `<button class="delete-btn" onclick="removeFromContinueWatching(event, ${item.id})">✕</button>` 
        : '';

      const rankMarkup = options.rank ? `<span class="rank-tag">TOP ${options.rank}</span>` : '';
      
      // Hide S1 E1 for Movies, show for TV series
      const badgeMarkup = (options.isContinue && item.media_type === 'tv')
        ? `<span class="card-badge">S${item.season || 1} E${item.episode || 1}</span>` 
        : '';

      card.innerHTML = `
        <div class="poster-wrapper">
          ${posterMarkup}
          ${deleteBtnMarkup}
          ${rankMarkup}
          ${badgeMarkup}
        </div>
        <div class="card-meta">
          <h4 class="card-title">${title}</h4>
          <div class="card-sub">
            <span class="rating-red">★ ${item.vote_average?.toFixed(1) || 'N/A'}</span>
            <span>• ${date}</span>
            <span>• ${type}</span>
          </div>
        </div>
      `;

      card.addEventListener('click', () => openDetail(item, options.isContinue || false));
      return card;
    }

    // Continue Watching Management
    function loadContinueWatching() {
      const saved = localStorage.getItem('cine_continue_watching');
      const section = document.getElementById('continueWatchingSection');
      if (!saved) {
        section.style.display = 'none';
        return;
      }

      try {
        const items = JSON.parse(saved);
        if (items.length > 0) {
          section.style.display = 'block';
          renderCarousel('continueCarousel', items, { isContinue: true });
        } else {
          section.style.display = 'none';
        }
      } catch (e) {
        section.style.display = 'none';
      }
    }

    function saveToContinueWatching(item, season = 1, episode = 1) {
      const existing = JSON.parse(localStorage.getItem('cine_continue_watching') || '[]');
      const filtered = existing.filter(i => i.id !== item.id);
      const mediaType = item.media_type || (item.first_air_date ? 'tv' : 'movie');

      const newItem = {
        id: item.id,
        title: item.title || item.name,
        poster_path: item.poster_path,
        media_type: mediaType,
        season: season,
        episode: episode,
        vote_average: item.vote_average,
        release_date: item.release_date || item.first_air_date
      };

      const updated = [newItem, ...filtered].slice(0, 10);
      localStorage.setItem('cine_continue_watching', JSON.stringify(updated));
    }

    function removeFromContinueWatching(e, itemId) {
      e.stopPropagation();
      const existing = JSON.parse(localStorage.getItem('cine_continue_watching') || '[]');
      const updated = existing.filter(i => i.id !== itemId);
      localStorage.setItem('cine_continue_watching', JSON.stringify(updated));
      loadContinueWatching();
    }

    // Open Detail View & Player
    async function openDetail(item, autoPlay = false) {
      const type = item.media_type || (item.first_air_date ? 'tv' : 'movie');
      selectedMedia = { ...item, media_type: type };
      selectedSeason = item.season || 1;
      selectedEpisode = item.episode || 1;

      document.getElementById('homePage').style.display = 'none';
      document.getElementById('detailPage').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      updatePlayerUrl(autoPlay);
      saveToContinueWatching(selectedMedia, selectedSeason, selectedEpisode);

      // Fetch Full Details & Recommendations
      try {
        const [detailsRes, similarRes] = await Promise.all([
          fetch(`${TMDB_BASE_URL}/${type}/${item.id}?api_key=${TMDB_API_KEY}`),
          fetch(`${TMDB_BASE_URL}/${type}/${item.id}/similar?api_key=${TMDB_API_KEY}`)
        ]);

        const details = await detailsRes.json();
        const similar = await similarRes.json();

        // Render Metadata
        document.getElementById('metaBlock').innerHTML = `
          <h2 class="detail-title">${details.title || details.name}</h2>
          <div class="meta-sub">
            <span class="rating-red">★ ${details.vote_average?.toFixed(1) || 'N/A'}</span>
            <span>${(details.release_date || details.first_air_date)?.split('-')[0] || ''}</span>
            <span class="type-badge">${type.toUpperCase()}</span>
          </div>
          <p class="overview-text">${details.overview || 'No overview available.'}</p>
        `;

        // Handle TV Seasons/Episodes
        const tvSelectorCard = document.getElementById('tvSelectorCard');
        if (type === 'tv' && details.seasons) {
          tvSelectorCard.style.display = 'block';
          renderSeasons(details.seasons.filter(s => s.season_number > 0));
        } else {
          tvSelectorCard.style.display = 'none';
        }

        // Render Similar Recommendations
        if (similar.results) {
          renderCarousel('similarCarousel', similar.results.map(i => ({ ...i, media_type: type })));
        }
      } catch (err) {
        console.error('Detail fetch error:', err);
      }
    }

   function updatePlayerUrl(autoPlay = false) {
  const player = document.getElementById('videoPlayer');
  const type = selectedMedia.media_type;
  
  if (type === 'tv') {
    player.src = `https://vidfast.vc/tv/${selectedMedia.id}/${selectedSeason}/${selectedEpisode}?theme=e50914&autoPlay=${autoPlay}`;
  } else {
    player.src = `https://vidfast.vc/movie/${selectedMedia.id}?theme=e50914&autoPlay=${autoPlay}`;
  }
}

    function renderSeasons(seasons) {
      const row = document.getElementById('seasonsRow');
      row.innerHTML = '';
      seasons.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `season-btn ${selectedSeason === s.season_number ? 'active' : ''}`;
        btn.innerText = `Season ${s.season_number}`;
        btn.onclick = () => {
          selectedSeason = s.season_number;
          selectedEpisode = 1;
          renderSeasons(seasons);
          fetchEpisodes(selectedMedia.id, s.season_number);
          updatePlayerUrl(true);
          saveToContinueWatching(selectedMedia, selectedSeason, selectedEpisode);
        };
        row.appendChild(btn);
      });
      fetchEpisodes(selectedMedia.id, selectedSeason);
    }

    async function fetchEpisodes(tvId, seasonNum) {
      try {
        const res = await fetch(`${TMDB_BASE_URL}/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        if (data.episodes) {
          const grid = document.getElementById('episodesGrid');
          grid.innerHTML = '';
          data.episodes.forEach(ep => {
            const btn = document.createElement('button');
            btn.className = `episode-btn ${selectedEpisode === ep.episode_number ? 'active' : ''}`;
            btn.innerText = `E${ep.episode_number}`;
            btn.onclick = () => {
              selectedEpisode = ep.episode_number;
              fetchEpisodes(tvId, seasonNum);
              updatePlayerUrl(true);
              saveToContinueWatching(selectedMedia, selectedSeason, selectedEpisode);
            };
            grid.appendChild(btn);
          });
        }
      } catch (err) {
        console.error('Episodes error:', err);
      }
    }
  </script>
</body>
</html>
